[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meli-forensics"
version = "1.0.0"
description = "Reproducible forensic analysis of invoice-search access logs"
requires-python = ">=3.11"
dependencies = [
  "duckdb==1.3.2",
  "matplotlib==3.10.5",
  "requests==2.32.4",
]

[project.optional-dependencies]
agent = ["openai>=1.99.0,<2"]
dev = ["pytest>=8.3,<9", "nbformat==5.10.4", "reportlab==4.4.3"]

[project.scripts]
meli-forensics = "meli_forensics.cli:main"
meli-forensics-agent = "meli_forensics.agent:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
